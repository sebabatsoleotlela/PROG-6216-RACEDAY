name: Structure & Documentation Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /docs Directory Structure
        run: |
          if [ ! -d "docs" ]; then
            echo "Error: /docs directory missing!"
            exit 1
          fi
          
          if [ ! -f "docs/schema.sql" ]; then
            echo "Error: docs/schema.sql missing!"
            exit 1
          fi

          if [ ! -f "docs/api-plan.md" ] && [ ! -f "docs/api-plan.pdf" ]; then
            echo "Error: API plan missing in /docs!"
            exit 1
          fi

          echo "All required planning documents are present!"
          
